name: Profile

on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    # One job at a time so the commits don't race
    strategy:
      max-parallel: 1
      matrix:
        include:
          - file: overview
            base: header, activity, community, repositories
            plugins: ""
          - file: languages
            base: ""
            plugins: languages
          - file: calendar
            base: ""
            plugins: isocalendar
          - file: habits
            base: ""
            plugins: habits
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: semigundogdu
          filename: metrics/${{ matrix.file }}.svg
          template: classic
          base: ${{ matrix.base }}
          config_timezone: Europe/Istanbul
          config_display: regular
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: ${{ matrix.plugins == 'languages' }}
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss, shell, dockerfile, makefile, cmake, c++, swift, kotlin, objective-c, ruby, batchfile, powershell
          plugin_isocalendar: ${{ matrix.plugins == 'isocalendar' }}
          plugin_isocalendar_duration: full-year
          plugin_habits: ${{ matrix.plugins == 'habits' }}
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: no
          plugin_habits_charts: yes

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#58a6ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
